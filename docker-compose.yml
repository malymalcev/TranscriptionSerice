services:
  transcription-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      - MODEL_SIZE=base
    volumes:
      - whisper_cache:/root/.cache/whisper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 60s
      timeout: 60s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G

  gradio-demo:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    ports:
      - "7860:7860"
    environment:
      - API_URL=http://transcription-service:8000
    depends_on:
      transcription-service:
        condition: service_healthy

volumes:
  whisper_cache: